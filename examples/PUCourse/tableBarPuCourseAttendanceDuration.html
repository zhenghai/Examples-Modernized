<!DOCTYPE html>
<meta charset="utf-8">
<style type="text/css">

table {
  border-collapse: collapse;
  font: 12px sans-serif;
  width: 96px;
}

th {
  font-weight: normal;
  text-align: right;
  padding-right: 6px;
  min-width: 180px;
}

thead td {
  cursor: s-resize;
}

tbody tr:first-child td {
  padding-top: 2px;
}

tbody td {
  padding: 0;
  border-left: solid 1px #000;
}

tbody rect {
  //fill: steelblue;
  fill-opacity: 0.7;
}

tbody tr:hover rect {
  //fill: brown;
  fill-opacity: 1;
}

tbody tr:text {
  fill: white;
  font: 10px sans-serif;
  text-anchor: end;
}
.large-header {
    font-size: 13px;
    font-weight: bold;
}

/* Legend Styling Rules */
.color-legend {
  font-family: sans-serif;
  font-size: 13px;
  margin: 15px 0 20px 50px;
  display: flex;
  gap: 20px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  opacity: 0.7; /* Matches the fill-opacity of your tbody rects */
}

/* Colors matching Colorbrewer Set1[3] */
.highly-regulated { background-color: #e41a1c; }
.less-regulated { background-color: #377eb8; }

</style>

<script src="https://d3js.org/d3.v2.min.js"></script>
<script src="https://d3js.org/colorbrewer.v1.min.js"></script>

<h2 id="title">Sortable Table PU Courses</h2>
<aside>Click on the column header to sort.</aside>
<br>

<script>


d3.csv("/examples/PUCourse/attendance_and_duration_pivot_by_group.csv", function(groups) {
  len = groups.length;
  ind = groups.slice(0,len-1);
  max = groups.slice(len-1);

  utilization = d3.keys(groups[0]).filter(function(key) {
      return key != "Duration (Minutes)"; //&& key != "R" && key != "PEI";
  });

ncol = utilization.length;
var table = d3.select("body").append("table")
            .attr("style", "margin-left: 50px")
            //.style("border-collapse", "collapse")
            //.style("border", "2px black solid"),
thead = table.append("thead"),
tbody = table.append("tbody");

// append the header row
thead.append("tr")
     .selectAll("th")
     .data(utilization.slice(0,ncol))
     .enter()
     .append("th")
     .text(function(col) { return col; })
     .attr("class", "large-header"); // Adds a custom CSS class
 // render the table
 // var table = tabulate(groups, utilization);

  d3.selectAll("thead th").data(utilization).on("click", function(k) {
    tr.sort(function(a, b) { 
       if (k != utilization[0] && k != utilization[ncol]) return (b[k]) - (a[k]); 
       else return d3.ascending(a[k],b[k]) });
  });

  var tr = d3.select("tbody").selectAll("tr")
      .data(ind)
    .enter().append("tr");

  tr.append("th")
      .text(function(d) { return d.Group; });

  //var color = d3.scale.category10();
  color = d3.scale.ordinal()
    .domain(["Highly Regulated", "Less Regulated"])
    .range(colorbrewer.Set1[3]);
  demo = utilization.filter(function(key) { return key != utilization[0]; });
  td = tr.selectAll("td")
      .data(function(d) { //return demo.map(function(k) { return d[k]/max[0][k]; });
                          return demo.map(function(k) { return [d[k], max[0][k], k, d[utilization[ncol]]]; });
                        })
    .enter().append("td")//.html(function(d) { return d[0]; })
      .append("svg")
      .attr("width", 160)
      .attr("height", 18);
  td.append("rect")
      .style("fill", function(d) { return color(d[3]); })
      .attr("height", 18)
      .attr("width", function(d) { return d[0]/d[1] * 120; });
  formatPercent = d3.format(".0%")
  formatNum = d3.format(".2f")
  td.append("text")
      .attr("x", function(d) { //return d; 
                              return d[0]/d[1]*120+3;
                             })
      .attr("y", 9)
      //.attr("dy", ".35em")
      .text(function(d) { 
           if (d[2] == "Actual Attendance") return d[0]; 
           else return formatNum(d[0]);
           });
});

function tabulate(data, columns) {
var table = d3.select("body").append("table")
            .attr("style", "margin-left: 250px")
            .style("border-collapse", "collapse")
            .style("border", "3x black solid"),
thead = table.append("thead"),
tbody = table.append("tbody");

// append the header row
thead.append("tr")
     .selectAll("th")
     .data(columns)
     .enter()
     .append("th")
     .text(function(column) { return column; });


// create a row for each object in the data
var rows = tbody.selectAll("tr")
           .data(data)
           .enter()
           .append("tr");

// create a cell in each row for each column
var cells = rows.selectAll("td")
            .data(function(row) { 
                  return columns.map(function(column) {
                         return {column: column, value: row[column]};
                  });
            })
            .enter()
            .append("td")
            //.attr("style", "font-family: Courier")
            .attr("class","thead td")
            .html(function(d) { return d.value; });
return table;
}


</script>
