
<!DOCTYPE html>
<meta charset="utf-8">

<style>

body {
  margin: 0;
  position: relative;
  font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif;
}

svg {
  font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.axis path,
.axis line {
  fill: none;
  stroke: #000;
  shape-rendering: crispEdges;
}

.axis--y path,
.axis--x path {
  display: none;
}

.sources {
  fill: none;
  stroke-linejoin: round;
  stroke-linecap: round;
  stroke-width: 2px;
}

.source--hover {
  stroke-width: 4px;
}

.focus text {
  text-anchor: middle;
  text-shadow:
    0 1px 0 #fff,
    1px 0 0 #fff,
    0 -1px 0 #fff,
    -1px 0 0 #fff;
}

.voronoi path {
  fill: none;
  pointer-events: all;
}

.voronoi--show path {
  stroke: red;
  stroke-opacity: .2;
}

#form {
  position: absolute;
  top: 20px;
  right: 30px;
  visibility: hidden;
}

#menu {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 300px;
}

#menu select {
  margin-top: 5px;
  width: 220px;
  padding: 4px;
}

#chart {
  width: 960px;
  margin-left: 200px;
  margin-top: 20px;
}

.legend {
  font-size: 12px;
}

.legend line {
  stroke-width: 3px;
}

.grid line {
  stroke: #ddd;
  stroke-width: 1px;
}

</style>


<h2 style="position: sticky; top: 0; text-align: center; background: white; z-index: 1000;" id="title">AoH Visits 2025</h2>

<div id="chart"></div>

<div id="menu">
  <div><strong>Visitor Source</strong></div>
</div>

<label id="form" for="show-voronoi">
  Show Voronoi
  <input type="checkbox" id="show-voronoi">
</label>


<script src="https://d3js.org/d3.v3.min.js"></script>
<script>

// ============================================================
// SETTINGS
// ============================================================

var hours = [];

var hourFormat = d3.time.format("%I:%M %p");

var margin = {
  top: 50,
  right: 180,
  bottom: 60,
  left: 80
};

var width = 960 - margin.left - margin.right;
var height = 500 - margin.top - margin.bottom;


// ============================================================
// SCALES
// ============================================================

var x = d3.time.scale()
  .range([0, width]);

var y = d3.scale.linear()
  .range([height, 0]);


// ============================================================
// LINE
// ============================================================

var line = d3.svg.line()
  .interpolate("monotone")
  .x(function(d) {
    return x(d.hour);
  })
  .y(function(d) {
    return y(d.value);
  });


// ============================================================
// SVG
// ============================================================

var svg = d3.select("#chart")
  .append("svg")
  .attr(
    "width",
    width + margin.left + margin.right
  )
  .attr(
    "height",
    height + margin.top + margin.bottom
  )
  .append("g")
  .attr(
    "transform",
    "translate(" +
      margin.left +
      "," +
      margin.top +
      ")"
  );


// ============================================================
// LOAD CSV
// ============================================================

d3.csv(
  "visitor_hourly_pivot.csv",
  type,
  function(error, sources) {

    if (error) {
      console.error("Error loading CSV:", error);
      return;
    }

    console.log("Sources:", sources);
    console.log("Hours:", hours);


    // ========================================================
    // X DOMAIN
    // ========================================================

    x.domain(
      d3.extent(hours)
    );


    // ========================================================
    // Y DOMAIN
    // ========================================================

    var maxValue = d3.max(
      sources,
      function(source) {
        return d3.max(
          source.values,
          function(d) {
            return d.value;
          }
        );
      }
    );

    y.domain([
      0,
      maxValue
    ]).nice();


    // ========================================================
    // X AXIS
    // ========================================================

    svg.append("g")
      .attr("class", "axis axis--x")
      .attr(
        "transform",
        "translate(0," + height + ")"
      )
      .call(
        d3.svg.axis()
          .scale(x)
          .orient("bottom")
          .tickValues(hours)
          .tickFormat(hourFormat)
          .tickSize(0)
          .tickPadding(10)
      );


    // ========================================================
    // Y AXIS
    // ========================================================

    svg.append("g")
      .attr("class", "axis axis--y")
      .call(
        d3.svg.axis()
          .scale(y)
          .orient("left")
          .ticks(10)
          .tickSize(0)
          .tickPadding(8)
      )
      .append("text")
      .attr("x", 0)
      .attr("y", -25)
      .style("font-weight", "bold")
      .style("text-anchor", "start")
      .text("Visitors");


    // ========================================================
    // GRID LINES
    // ========================================================

    svg.append("g")
      .attr("class", "grid")
      .selectAll("line")
      .data(y.ticks(10))
      .enter()
      .append("line")
      .attr("x1", 0)
      .attr("x2", width)
      .attr("y1", function(d) {
        return y(d);
      })
      .attr("y2", function(d) {
        return y(d);
      });


    // ========================================================
    // COLORS
    // ========================================================
    var colorScale = d3.scale.category10();

    // ========================================================
    // DRAW TRENDLINES
    // ========================================================

    svg.append("g")
      .attr("class", "sources")
      .selectAll("path")
      .data(sources)
      .enter()
      .append("path")
      .attr("class", "source-line")
      .attr("d", function(d) {

        d.line = this;

        return line(d.values);

      })
      .style("stroke", function(d) {

          return colorScale(d.name);

      });


    // ========================================================
    // FOCUS
    // ========================================================

    var focus = svg.append("g")
      .attr(
        "transform",
        "translate(-100,-100)"
      )
      .attr(
        "class",
        "focus"
      );


    focus.append("circle")
      .attr("r", 4)
      .style("fill", "white")
      .style("stroke", "blue")
      .style("stroke-width", "2px");


    focus.append("text")
      .attr("y", -12)
      .style("font-weight", "bold");


    // ========================================================
    // VORONOI
    // ========================================================

    var voronoi = d3.geom.voronoi()
      .x(function(d) {
        return x(d.hour);
      })
      .y(function(d) {
        return y(d.value);
      })
      .clipExtent([
        [-margin.left, -margin.top],
        [
          width + margin.right,
          height + margin.bottom
        ]
      ]);


    var voronoiGroup = svg.append("g")
      .attr("class", "voronoi");


    var allValues = d3.merge(
      sources.map(function(source) {
        return source.values;
      })
    );


    var voronoiData = voronoi(
      d3.nest()
        .key(function(d) {
          return x(d.hour) + "," + y(d.value);
        })
        .rollup(function(v) {
          return v[0];
        })
        .entries(allValues)
        .map(function(d) {
          return d.values;
        })
    );


    voronoiGroup.selectAll("path")
      .data(voronoiData)
      .enter()
      .append("path")
      .attr("d", function(d) {

        if (!d) {
          return null;
        }

        return "M" + d.join("L") + "Z";

      })
      .datum(function(d) {

        return d.point;

      })
      .on("mouseover", mouseover)
      .on("mouseout", mouseout);


    // ========================================================
    // VORONOI CHECKBOX
    // ========================================================

    d3.select("#show-voronoi")
      .property("disabled", false)
      .on("change", function() {

        voronoiGroup.classed(
          "voronoi--show",
          this.checked
        );

      });


    // ========================================================
    // DROPDOWN MENU
    // ========================================================

    var list = d3.select("#menu")
      .append("select")
      .on("change", change);


    var options = list.selectAll("option")
      .data(sources)
      .enter()
      .append("option")
      .attr("value", function(d) {

        return d.name;

      })
      .text(function(d) {

        return d.name;

      });


    // ========================================================
    // INITIAL SELECTION
    //
    // IMPORTANT:
    // Use FIRST point, not last point.
    // ========================================================

    var data0 = sources[0].values[0];

    mouseover(data0);


    // ========================================================
    // MOUSEOVER
    // ========================================================

    function mouseover(d) {

      if (!d || !d.source) {
        return;
      }


      // Remove previous highlight
      if (data0 && data0 !== d) {
        mouseout(data0);
      }


      // Highlight selected trendline
      d3.select(d.source.line)
        .classed(
          "source--hover",
          true
        );


      // Move selected line to front
      if (d.source.line.parentNode) {

        d.source.line.parentNode
          .appendChild(d.source.line);

      }


      // Move focus circle to selected point
      focus.attr(
        "transform",
        "translate(" +
          x(d.hour) +
          "," +
          y(d.value) +
          ")"
      );


      // Display information
      focus.select("text")
        .text(
          d.source.name +
          " — " +
          hourFormat(d.hour) +
          ": " +
          d.value
        );


      data0 = d;

    }


    // ========================================================
    // MOUSEOUT
    // ========================================================

    function mouseout(d) {

      if (!d || !d.source) {
        return;
      }

      d3.select(d.source.line)
        .classed(
          "source--hover",
          false
        );

    }


    // ========================================================
    // DROPDOWN CHANGE
    //
    // IMPORTANT:
    // Select the FIRST point in the trendline.
    // ========================================================

    function change() {

      var selectedIndex =
        list.property("selectedIndex");


      var selectedSource =
        sources[selectedIndex];


      if (!selectedSource) {
        return;
      }


      // Remove previous highlight
      if (data0) {
        mouseout(data0);
      }


      // FIRST point = 10:00 AM
      var selectedData =
        selectedSource.values[0];


      // Highlight selected trendline
      mouseover(selectedData);


      // Keep first point selected
      data0 = selectedData;

    }


    // ========================================================
    // LEGEND
    // ========================================================

    var legend = svg.append("g")
      .attr("class", "legend")
      .attr(
        "transform",
        "translate(" +
          (width + 20) +
          ",0)"
      );


    legend.selectAll("g")
      .data(sources)
      .enter()
      .append("g")
      .attr(
        "transform",
        function(d, i) {

          return "translate(0," +
            (i * 25) +
            ")";

        }
      )
      .each(function(d) {

        var g = d3.select(this);


        g.append("line")
          .attr("x1", 0)
          .attr("x2", 20)
          .attr("y1", 0)
          .attr("y2", 0)
          .style(
            "stroke",
            colorScale(d.name)
          );


        g.append("text")
          .attr("x", 28)
          .attr("y", 4)
          .text(d.name);

      });

  }
);


// ============================================================
// CSV PARSER
// ============================================================

function type(d, i) {

  // ----------------------------------------------------------
  // Read hours from first CSV row
  // ----------------------------------------------------------

  if (i === 0) {

    hours = Object.keys(d)
      .filter(function(key) {

        return key !== "Visitor Source";

      })
      .map(function(key) {

        return hourFormat.parse(key);

      })
      .filter(function(hour) {

        return hour !== null;

      });

  }


  // ----------------------------------------------------------
  // Create source
  // ----------------------------------------------------------

  var source = {

    name: d["Visitor Source"],

    values: []

  };


  // ----------------------------------------------------------
  // Create hourly values
  // ----------------------------------------------------------

  source.values = hours.map(function(hour) {

    var hourString =
      hourFormat(hour);


    var value =
      parseFloat(
        d[hourString]
      );


    if (isNaN(value)) {
      value = 0;
    }


    return {

      source: source,

      hour: hour,

      value: value

    };

  });


  return source;

}

</script>
